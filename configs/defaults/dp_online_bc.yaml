# Shared training settings for this variant.
training:
  timeout_on_horizon: true
  total_policy_steps: 100000000
  warmup_policy_steps: 512
  utd: 0.25
  batch_size: 256
  replay_size: 1000000
  pipeline: q_learning
  warmup_transitions: 512
  initial_critic_updates: 5000
  online_transitions: 100000000
  offline_eval_every_updates: 0
  eval_episodes: 50
  eval_n_envs: 4
  vecenv_start_method: fork
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  target_policy_mode: q_greedy
  cql_alpha: 0.3
  critic_ensemble_size: 10
  target_critic_subsample_size: 2
  target_q_clip_min: -1000
  target_q_clip_max: 0
  critic_obs_action_mode: dp_raw
  bc_finetune_mode: online_success
  bc_update_every_rl_updates: 2
  bc_schedule_axis: env
  bc_success_capacity: 25000
  bc_online_sampling: episode
  bc_teacher_constraint_weight: 1.0
  bc_base_mix_fraction: 0.0
  dp_infer_gpus: ''
  log_every_policy_steps: 512
  save_freq: 100000000
  force_thread_limits: true
