# Shared training settings for this variant.
training:
  env_horizon_override: 300
  timeout_on_horizon: true
  total_policy_steps: 100000000
  warmup_policy_steps: 512
  utd: 0.25
  batch_size: 256
  replay_size: 1000000
  pipeline: q_learning
  warmup_transitions: 512
  demo_prefill_npz: '@demonstrations'
  demo_prefill_ratio: 0.2
  demo_prefill_replay_size: 2500000
  initial_critic_updates: 5000
  online_transitions: 100000000
  eval_interval: 30000
  offline_eval_every_updates: 0
  eval_episodes: 50
  eval_n_envs: 4
  n_envs: 4
  vecenv_start_method: fork
  gamma: 0.997
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  hidden_dims: 512,512,512
  target_policy_mode: q_greedy
  cql_alpha: 0.3
  critic_ensemble_size: 10
  target_critic_subsample_size: 2
  target_q_clip_min: -1000.0
  target_q_clip_max: 0.0
  critic_obs_action_mode: dp_raw
  critic_obs_state_mode: stats_no_clip
  dp_infer_steps: 20
  dp_infer_gpus: ''
  log_every_policy_steps: 512
  save_freq: 100000000
  latest_model_save_freq: 10000000
  save_best_model: false
  save_periodic_models: false
  force_thread_limits: true
