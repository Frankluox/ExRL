training:
  data_mode: mixed
  residual_granularity: chunk
  action_scale: 0.1
  actor_lr: 5.0e-06
  critic_lr: 0.0001
  tau: 0.01
  target_noise_std: 0.01
  target_noise_clip: 0.3
  exploration_std: 0.025
  exploration_clip: 0.3
  warmup_residual_scale: 0.1
  critic_updates_per_transition: 1.0
  actor_updates_per_transition: 0.25
  critic_ensemble_size: 10
  target_critic_subsample_size: 2
  batch_size: 256
  n_step: 1
  n_envs: 4
  eval_n_envs: 4
  eval_episodes: 50
  learning_starts: 2048
  critic_warmup_updates: 2000
  online_replay_capacity: 1000000
  offline_replay_capacity: 1000000
  total_train_steps: 100000000
  eval_interval: 200000
  checkpoint_interval: 500000
  td_loss_mode: per_head_mse
  replay_action_mode: executed_clamped
