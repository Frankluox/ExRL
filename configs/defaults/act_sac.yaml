# Shared training settings for this variant.
training:
  total_policy_steps: 100000000
  utd: 1.0
  batch_size: 256
  replay_size: 1000000
  warmup_transitions: 512
  initial_critic_updates: 5000
  eval_episodes: 50
  n_envs: 4
  tau: 0.005
  actor_lr: 5.0e-05
  critic_lr: 0.0003
  cql_alpha: 0.01
  critic_ensemble_size: 10
  dp_infer_gpus: ''
  save_freq: 100000000
  force_thread_limits: true
  resume_from: ''
