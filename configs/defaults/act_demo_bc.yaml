# Shared training settings for this variant.
training:
  timeout_on_horizon: true
  total_policy_steps: 100000000
  warmup_policy_steps: 512
  utd: 0.25
  batch_size: 256
  replay_size: 1000000
  pipeline: q_learning
  warmup_transitions: 512
  initial_critic_updates: 5000
  online_transitions: 100000000
  offline_eval_every_updates: 0
  eval_episodes: 50
  eval_n_envs: 4
  n_envs: 12
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  target_policy_mode: q_greedy
  cql_alpha: 0.3
  critic_ensemble_size: 10
  target_critic_subsample_size: 2
  target_q_clip_min: -1000.0
  target_q_clip_max: 0.0
  critic_obs_action_mode: dp_raw
  critic_obs_state_mode: stats_no_clip
  bc_finetune_mode: online_success
  bc_updates_per_rl_update: 5
  bc_update_every_rl_updates: 1
  bc_batch_size: 128
  bc_grad_clip_norm: 10.0
  bc_offline_demo_npz: '@demonstrations'
  bc_offline_fraction: 0.5
  max_train_env_steps: 30000000
  diagnostic_snapshot_env_steps: 0,1000000,2000000,5000000,10000000,15000000,20000000,30000000
  bc_teacher_constraint_weight: 0.0
  dp_infer_gpus: ''
  force_thread_limits: true
  bc_updates_decay_env_steps: 600000
