defaults:
- ../../defaults/act_sac.yaml
task: tool_hang
base_policy: act
chunk_size: 32
runtime:
  mujoco: 3.3.5
  robosuite: 1.5.1
algorithm: sac
training:
  lowdim_keys: robot0_eef_pos,robot0_eef_quat,robot0_gripper_qpos,object
  env_horizon_override: 800
  stop_after_env_steps: 30000000
  gamma: 0.999
  hidden_dims: 512,512,512
  online_eval_action_mode: both
  latest_model_save_freq: 100000000
  latest_model_save_env_freq: 500000
