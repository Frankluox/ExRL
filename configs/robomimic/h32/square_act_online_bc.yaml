defaults:
- ../../defaults/act_online_bc.yaml
task: square
base_policy: act
chunk_size: 32
runtime:
  mujoco: 3.3.5
  robosuite: 1.4.1
algorithm: q
training:
  lowdim_keys: robot0_eef_pos,robot0_eef_quat,robot0_gripper_qpos,object
  env_horizon_override: 400
  eval_interval: 100000
  n_envs: 48
  gamma: 0.997
  hidden_dims: 512,512,512
  save_freq: 100000000
  latest_model_save_freq: 500000
