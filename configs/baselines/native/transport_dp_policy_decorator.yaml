name: transport_dp_policy_decorator
algorithm: residual_sac
seed: 42
device: cuda:0
use_wandb: false
env_name: transport
obs_dim: 59
action_dim: 14
cond_steps: 1
act_steps: 50
load_offline_data: false
deterministic_eval: true
eval_interval: 1000000
num_evals: 2
save_model_interval: 1000000
save_replay_buffer: false
env:
  n_envs: 1
  n_eval_envs: 4
  name: ${env_name}
  max_episode_steps: 800
  reset_at_iteration: false
  save_video: false
  best_reward_threshold_for_success: 1
  reward_offset: 1
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys:
      - robot0_eef_pos
      - robot0_eef_quat
      - robot0_gripper_qpos
      - robot1_eef_pos
      - robot1_eef_quat
      - robot1_gripper_qpos
      - object
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
wandb: null
train:
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: ${train.actor_lr}
  alpha_lr: ${train.critic_lr}
  batch_size: 256
  train_freq: 1
  utd: 30
  use_layer_norm: true
  layer_size: 2048
  num_layers: 3
  discount: 0.999
  ent_coef: 0.0005
  target_ent: 0.0
  log_std_init: 0.0
  standard_gauss_init: true
  init_rollout_steps: 0
  learning_starts: 8
  n_critics: 2
  res_scale: 0.02
  prog_explore_steps: 100
  actor_gradient_steps: 20
  action_norm_regularization: 0.0
  max_grad_norm: 50
  actor_obs_mode: obs_base_action
  env_step_eval_interval: 200000
  env_step_eval_episodes: 50
  async_eval_snapshot_interval: 0
  max_env_steps: 20000000
model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: 0
  predict_epsilon: true
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims:
    - 512
    - 512
    - 512
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${act_steps}
    action_dim: ${action_dim}
  horizon_steps: ${act_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 100
  device: ${device}
  use_ddim: true
  ddim_steps: 5
  controllable_noise: true
base_policy_type: diffusion
diffusion_horizon_steps: 50
base_policy_horizon_steps: 50
execute_steps: 50
resume_from: null
