name: lift_dp_dsrl
algorithm: dsrl_na
seed: 42
device: cuda:0
use_wandb: false
env_name: lift
obs_dim: 19
action_dim: 7
cond_steps: 1
act_steps: 50
load_offline_data: false
deterministic_eval: false
eval_interval: 3000
num_evals: 200
save_model_interval: 100000
save_replay_buffer: false
env:
  n_envs: 4
  n_eval_envs: 4
  name: ${env_name}
  max_episode_steps: 300
  reset_at_iteration: false
  save_video: false
  best_reward_threshold_for_success: 1
  reward_offset: 1
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys:
      - robot0_eef_pos
      - robot0_eef_quat
      - robot0_gripper_qpos
      - object
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
  terminate_on_success: false
  timeout_on_horizon: false
wandb: null
train:
  tau: 0.005
  actor_lr: 0.0003
  batch_size: 256
  train_freq: 1
  utd: 30
  noise_critic_grad_steps: 10
  use_layer_norm: true
  layer_size: 2048
  num_layers: 3
  discount: 0.99
  ent_coef: -1
  target_ent: 0.0
  init_rollout_steps: 1501
  action_magnitude: 1.5
  n_critics: 2
  critic_backup_combine_type: min
  max_env_steps: 2000000
model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: 0
  predict_epsilon: true
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims:
    - 512
    - 512
    - 512
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${act_steps}
    action_dim: ${action_dim}
  horizon_steps: ${act_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 100
  device: ${device}
  use_ddim: true
  ddim_steps: 5
  controllable_noise: true
execute_steps: 50
diffusion_horizon_steps: 50
base_policy_horizon_steps: 50
online_eval:
  interval_env_steps: 200000
  total_episodes: 50
  async_eval: false
