benchmark: robomimic
method: resfit
base_policy: act
task: square
chunk_size: 50
defaults:
- ../../defaults/resfit.yaml
training:
  gamma: 0.997
  env_horizon: 400
  actor_hidden_dims: 1024,1024,1024
  critic_hidden_dims: 1024,1024,1024
  critic_use_layernorm: 0
  residual_state_mode: stats_no_clip
  offline_success_mode: reward
  total_train_env_steps: 30000000
  lowdim_keys: robot0_eef_pos,robot0_eef_quat,robot0_gripper_qpos,object
