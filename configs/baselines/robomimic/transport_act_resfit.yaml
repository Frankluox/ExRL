benchmark: robomimic
method: resfit
base_policy: act
task: transport
chunk_size: 50
defaults:
- ../../defaults/resfit.yaml
training:
  gamma: 0.999
  env_horizon: 800
  actor_hidden_dims: 2048,2048,2048
  critic_hidden_dims: 2048,2048,2048
  critic_use_layernorm: 0
  residual_state_mode: stats_no_clip
  offline_success_mode: reward
  total_train_env_steps: 20000000
  lowdim_keys: robot0_eef_pos,robot0_eef_quat,robot0_gripper_qpos,robot1_eef_pos,robot1_eef_quat,robot1_gripper_qpos,object
