_target_: agent.pretrain.train_diffusion_agent.TrainDiffusionAgent
name: dp_lift
logdir: outputs/pretrain_dp
train_dataset_path: assets/lift/train.npz
seed: 42
device: cuda:0
env: lift
obs_dim: 19
action_dim: 7
denoising_steps: 100
horizon_steps: 50
cond_steps: 1
wandb: null
train:
  n_epochs: 10000
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 1.0e-06
  lr_scheduler:
    first_cycle_steps: 20000
    warmup_steps: 100
    min_lr: 1.0e-05
  save_model_freq: 100
model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: true
  denoised_clip_value: 1.0
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims:
    - 512
    - 512
    - 512
    residual_style: true
    cond_dim: 19
    horizon_steps: 50
    action_dim: 7
  horizon_steps: 50
  obs_dim: 19
  action_dim: 7
  denoising_steps: 100
  device: cuda:0
  use_ddim: true
  ddim_steps: 5
ema:
  decay: 0.995
train_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: 50
  cond_steps: 1
  device: cuda:0
env_name: lift
