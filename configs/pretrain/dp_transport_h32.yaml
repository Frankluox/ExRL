_target_: agent.pretrain.train_diffusion_agent.TrainDiffusionAgent
name: dp_transport
logdir: outputs/pretrain_dp
train_dataset_path: assets/transport/train.npz
seed: 44
device: cuda:0
env: transport
obs_dim: 59
action_dim: 14
denoising_steps: 100
horizon_steps: 32
cond_steps: 1
wandb: null
train:
  n_epochs: 10000
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 1.0e-06
  lr_scheduler:
    first_cycle_steps: 50000
    warmup_steps: 100
    min_lr: 1.0e-05
  save_model_freq: 1000
model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: true
  denoised_clip_value: 1.0
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims:
    - 4096
    - 4096
    - 4096
    residual_style: true
    cond_dim: 59
    horizon_steps: 32
    action_dim: ${action_dim}
    cond_mlp_dims:
    - 512
    - 64
  horizon_steps: 32
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 100
  device: ${device}
  use_ddim: true
  ddim_steps: 20
ema:
  decay: 0.995
train_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  device: ${device}
env_name: transport
